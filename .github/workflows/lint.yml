name: Lint

# Clippy and rustdoc with warnings as errors on the MSRV and stable, and
# rustfmt on stable. Beta and nightly stay test-only in tests.yml, so a lint
# new to them doesn't fail a PR.

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ matrix.rust }}
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      # The key includes the rustc version, so a new stable starts a fresh cache
      # rather than restoring artifacts the new compiler can't reuse.
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ steps.toolchain.outputs.cachekey }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-lint-${{ steps.toolchain.outputs.cachekey }}-${{ runner.os }}-

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run clippy without features
        run: cargo clippy --all-targets -- -D warnings

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
