name: Semver

# Checks the public API against the newest release on crates.io, so a breaking
# change fails the PR that makes it. Releases merge into main without a PR, so
# this runs on every PR and on pushes to main, develop and release branches. tgrf
# pushes only after tagging, so a release branch is checked before its tag only
# if it's pushed first.
# The release type is the level the next release must meet. The version in
# Cargo.toml usually still names the last release, so the tool can't infer it.
# Through 0.3.x it was minor: additions allowed, breaking changes not. develop
# is now headed for 1.0.0, which removes the names deprecated in 0.3.0, so it's
# major until 1.0.0 is out, and minor again after, for 1.x.
# Both feature groups run, so moving an item behind a feature fails too.

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-group: [default-features, all-features]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check semver against the last release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: major
          feature-group: ${{ matrix.feature-group }}
