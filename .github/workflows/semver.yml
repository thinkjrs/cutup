name: Semver

# Checks the public API against the newest release on crates.io, so a breaking
# change fails the PR that makes it. Releases merge into main without a PR, so
# this runs on every PR and on pushes to main and develop. The release type is
# minor, the level a 0.3.x release must meet under Cargo's rules: additions are
# allowed, breaking changes aren't. The version in Cargo.toml usually still
# names the last release, so the tool can't infer it.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check semver against the last release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: minor
          feature-group: all-features
