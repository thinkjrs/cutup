name: Semver

# Checks the public API for breaking changes, with every feature and with none,
# so moving an item behind a feature counts too.
#
# A PR is checked against the commit it's based on, at minor: additions are
# allowed and breaking changes aren't, so a break fails the PR that makes it,
# whatever the last release was. A break that's meant to ship, as 1.0.0's
# removal of the names deprecated in 0.3.0 was, can't pass this check, and
# that's the point: it's agreed in the roadmap first.
#
# A push is checked against the newest release on crates.io, since releases
# merge into main without a PR. tgrf pushes only after tagging, so a release
# branch is checked before its tag only if it's pushed first. The release type
# is set rather than derived, since the version in Cargo.toml usually still
# names the last release:
# - on a release/0.x branch, minor, so a 0.3.x cut from develop fails on the
#   removal instead of shipping it;
# - elsewhere, major until 1.0.0 is out, since develop and main carry the
#   removal; after 1.0.0, minor, for 1.x. The roadmap has that as a step of
#   the release.

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-group: [default-features, all-features]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A PR's base commit has to be in the clone to be built as the baseline. The whole
          # history is small, so every run fetches it.
          fetch-depth: 0

      - name: Check semver against the PR's base commit
        if: github.event_name == 'pull_request'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: minor
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          feature-group: ${{ matrix.feature-group }}

      - name: Check semver against the last release
        if: github.event_name != 'pull_request'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: ${{ startsWith(github.ref_name, 'release/0.') && 'minor' || 'major' }}
          feature-group: ${{ matrix.feature-group }}
