name: Semver

# Checks the public API for breaking changes, with every feature and with none,
# so moving an item behind a feature counts too.
#
# A PR is checked against the commit it's based on, at minor: additions are
# allowed and breaking changes aren't, so a break fails the PR that makes it,
# whatever the last release was. A break that's meant to ship, as 1.0.0's
# removal of the names deprecated in 0.3.0 was, can't pass this check, and
# that's the point: it's agreed in the roadmap first.
#
# A push is checked against the newest release on crates.io, since releases
# merge into main without a PR. The release type depends on the branch:
# - main: from the version in Cargo.toml, which on main is always a release's.
#   tgrf pushes develop, main and the tag, never the release branch, so main is
#   where a release is checked: merged as 0.3.14 it's checked at minor, and
#   fails on anything breaking, such as the removal develop carries; merged as
#   1.0.0, at major. It's checked once pushed, after its tag, so a failure
#   there comes before cargo publish, not before tgrf.
# - a release/0.x branch: minor, for the times one is pushed before tgrf.
# - develop and anything else: major until 1.0.0 is out, since develop
#   carries the removal while its version still names 0.3.13; after 1.0.0,
#   minor, for 1.x. The roadmap has that as a step of the release.

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-group: [default-features, all-features]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A PR's base commit has to be in the clone to be built as the baseline. The whole
          # history is small, so every run fetches it.
          fetch-depth: 0

      - name: Check semver against the PR's base commit
        if: github.event_name == 'pull_request'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: minor
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          feature-group: ${{ matrix.feature-group }}

      - name: Check semver against the last release
        if: github.event_name != 'pull_request'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # An empty release type leaves it unset, so the tool reads it from the version.
          # The empty string is written last: in these expressions it's false, so
          # `cond && '' || x` would always give x.
          release-type: ${{ startsWith(github.ref_name, 'release/0.') && 'minor' || (github.ref_name != 'main' && 'major' || '') }}
          feature-group: ${{ matrix.feature-group }}
