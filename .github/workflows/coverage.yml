name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-nightly-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # nextest writes per-test results to target/nextest/ci/junit.xml (the ci profile
      # in .config/nextest.toml) but doesn't run doctests, so they run in a second pass
      # and both are merged into lcov.info. Doctest coverage needs nightly.
      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest --all-features --no-report
          cargo llvm-cov --doc --all-features --no-report
          cargo llvm-cov report --doctests --lcov --output-path lcov.info
        env:
          NEXTEST_PROFILE: ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: thinkjrs/cutup
          files: lcov.info
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: thinkjrs/cutup
          report_type: test_results
          files: target/nextest/ci/junit.xml
