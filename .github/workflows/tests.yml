name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, stable, beta, nightly]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.rust }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.rust }}-${{ runner.os }}-

      - name: Run tests
        run: cargo test --all-features --all-targets

      # The examples print rather than assert, so this checks each one runs to the end without
      # an error. Building them is part of --all-targets above. Once is enough.
      - name: Run examples
        if: matrix.rust == 'stable'
        run: |
          for example in examples/*.rs; do
            cargo run --all-features --example "$(basename "$example" .rs)" > /dev/null
          done

      - name: Run doctests
        run: cargo test --all-features --doc

      - name: Run tests without features
        run: cargo test --all-targets

      # Tests too slow to run unoptimized, marked #[ignore]. Once is enough.
      - name: Run ignored tests optimized
        if: matrix.rust == 'stable'
        run: cargo test --release --all-features --lib -- --ignored
