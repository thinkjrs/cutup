name: Mutants

# Mutation testing with cargo-mutants: each mutant is a small change to the code, such as `<`
# for `<=`, and one that no test notices is a gap. On a PR, only the lines it changes are
# mutated, so new code arrives with tests that pin it. The whole crate takes too long for
# every PR, so it runs weekly, split across eight jobs, and reports what survives without
# failing. GitHub runs schedules from main only. docs/MUTATION.md describes the setup and what
# is excluded.

on:
  pull_request:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A PR that changes much of the solvers, such as a release PR, can mutate hundreds of lines.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff against the base branch
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      # A mutant that makes the tests time out, as one that loops forever does, counts as
      # caught: cargo-mutants exits 3 for those, and 2 for missed ones, which fail the job.
      # With both, it exits 3, so missed mutants are also read from missed.txt. Each process
      # gets at most 8 GiB of address space, so that a mutant that allocates without bound
      # fails its allocation, which counts as caught, before the runner, with 16 GB, runs out
      # and is shut down.
      - name: Mutate the changed lines
        run: |
          ulimit -v 8388608
          status=0
          cargo mutants --cargo-arg=--locked --no-shuffle -j 2 --in-diff pr.diff || status=$?
          if [ -s mutants.out/missed.txt ]; then
            echo "Missed mutants:"
            cat mutants.out/missed.txt
            exit 2
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-diff
          path: mutants.out

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # About 270 mutants a shard, some of them timing out at 60 s.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Report-only: some mutants no test can catch, such as `<` for `<=` on a tolerance, and
      # docs/MUTATION.md lists them. cargo-mutants exits 2 for missed mutants and 3 for timeouts,
      # which are reported here rather than failing the job; anything else is an error.
      # At most 8 GiB of address space a process, as for the diff job above: on 2026-11-13,
      # shard 1 lost its runner to a mutant in `hierarchy` that allocates without bound.
      - name: Mutate shard ${{ matrix.shard }} of 8
        run: |
          ulimit -v 8388608
          status=0
          cargo mutants --cargo-arg=--locked --no-shuffle -j 2 --shard ${{ matrix.shard }}/8 || status=$?
          for outcome in missed timeout; do
            if [ -f "mutants.out/$outcome.txt" ]; then
              echo "### Shard ${{ matrix.shard }}: $outcome mutants"
              echo '```'
              cat "mutants.out/$outcome.txt"
              echo '```'
            fi
          done >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
