[package]
name = "cutup"
version = "0.3.13"
edition = "2024"
authors = ["Jason R. Stevens, CFA <jason@thinkjrs.dev>"]
license = "MIT"
description = "Portfolio allocation in Rust: minimum variance, mean-variance, max Sharpe, max diversification, risk parity, HRP, HERC and minimum CVaR, with Black-Litterman expected returns and equal-weight, inverse-volatility and inverse-variance baselines."
repository = "https://github.com/thinkjrs/cutup"
homepage = "https://github.com/thinkjrs/cutup"
documentation = "https://docs.rs/cutup"
readme = "README.md"
keywords = ["portfolio", "allocation", "optimization", "finance", "quant"]
categories = ["finance", "mathematics", "science"]
# The fixtures are the ones the unit tests in `src` read, so that they build from the package.
include = [
    "/src/**/*",
    "/tests/fixtures/covariance.json",
    "/tests/fixtures/datasets.json",
    "/tests/fixtures/log_returns.json",
    "/tests/fixtures/lp.json",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
rust-version = "1.85.0"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
# Without nalgebra's `macros` feature, which only the tests and the doc examples use: it's a
# proc-macro crate, and brings syn, quote and proc-macro2 into a build that has no other use
# for them.
nalgebra = { version = "0.33.2", default-features = false, features = ["std"] }
serde = { version = "1.0.219", optional = true, features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[features]
# Constructors that take nalgebra's `DMatrix`, and `DVector` conversions for `Weights`.
nalgebra = []
# `Serialize` and `Deserialize` for weights, assets, bounds, covariance configs and every method,
# and `Serialize` for `CutupError` and rolling windows.
serde = ["dep:serde"]
# TypeScript types, with ts-rs, for the JSON the `serde` feature reads and writes.
ts-rs = ["dep:ts-rs", "serde"]

# Three of clippy's pedantic lints, the ones that found something in cutup:
# - a builder whose result is dropped does nothing, so the types the builders return, and
#   the getters, are `#[must_use]`;
# - every public function that returns a `Result` says which errors.
[lints.clippy]
must_use_candidate = "warn"
return_self_not_must_use = "warn"
missing_errors_doc = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
# `dmatrix!` and `dvector!`, for the tests and the doc examples.
nalgebra = { version = "0.33.2", features = ["macros"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

# proptest needs other features and a getrandom backend to build for wasm, so the property
# tests run natively. The benchmarks run natively too. criterion 0.8 needs Rust 1.86, above
# the MSRV, and without its default features it leaves out plotters and rayon.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "allocate"
harness = false
