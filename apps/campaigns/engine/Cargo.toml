[package]
name = "campaign-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
publish = false
description = "The campaign allocation app's engine: a JSON request in, a JSON response out."

[dependencies]
cutup = { path = "../../..", features = ["serde", "ts-rs"] }
serde = { version = "1.0.219", features = ["derive"] }
# Exact floats when reading requests, such as a risk aversion or a bound. Writing is exact
# without it.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
ts-rs = "12.0.1"

# The engine's tests, the parity fixtures included, run on wasm too, as the browser engine
# runs it, with `wasm-bindgen-test-runner`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
