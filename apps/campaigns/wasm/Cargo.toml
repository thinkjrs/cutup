[package]
name = "campaign-wasm"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
publish = false
description = "The campaign allocation app's engine, for the browser, with wasm-bindgen."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
campaign-engine = { path = "../engine" }
wasm-bindgen = "0.2.100"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
